<!DOCTYPE HTML>
<html lang="en">
<head>
  <title>Light Controller · Horizon</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: #0b0b0e;
      font-family: 'Inter', system-ui, sans-serif;
      overscroll-behavior: none;
      overflow: hidden;
    }
    #root { width: 100%; height: 100%; }
    @keyframes led-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.92)} }
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    /* ── Responsive tab grid layouts ── */
    .tab-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Toast notifications */
    .hz-toast-container { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:9999; pointer-events:none; }
    .hz-toast { padding:10px 18px; border-radius:10px; background:rgba(30,30,40,0.97); border:1px solid rgba(255,255,255,0.12); color:#fff; font-size:12px; font-weight:600; letter-spacing:0.3px; box-shadow:0 4px 24px rgba(0,0,0,0.5); animation:toastIn 0.18s ease; font-family:'Inter',sans-serif; }
    .hz-toast.ok  { border-color:rgba(34,197,94,0.5);  color:#86efac; }
    .hz-toast.err { border-color:rgba(244,63,94,0.5);  color:#fda4af; }
    .hz-toast.info{ border-color:rgba(59,130,246,0.5); color:#93c5fd; }
    @keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* Landscape prompt */
    .hz-landscape-prompt { display:none; }
    @media (orientation:portrait) and (max-width:768px) {
      .hz-landscape-prompt { display:flex; position:fixed; inset:0; z-index:9998; background:rgba(11,11,14,0.97); flex-direction:column; align-items:center; justify-content:center; gap:16px; }
    }

    /* LIVE: 2-col on desktop, 1-col on mobile */
    .live-grid {
      padding: 8px 14px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 700px) {
      .live-grid { grid-template-columns: 1fr; }
    }

    /* PROGRAMMER: 3-col on wide, 2-col on tablet, 1-col on mobile */
    .prog-grid {
      padding: 8px 14px 20px;
      display: grid;
      grid-template-columns: 0.85fr 0.95fr 1fr;
      gap: 10px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .prog-grid { grid-template-columns: 1fr 1fr; }
      .prog-col-fx { grid-column: 1 / -1; }
    }
    @media (max-width: 600px) {
      .prog-grid { grid-template-columns: 1fr; }
      .prog-col-fx { grid-column: auto; }
    }

    /* FOLLOWSPOT: 3-col on desktop, 1-col on mobile */
    .follow-grid {
      padding: 8px 14px 20px;
      display: grid;
      grid-template-columns: 0.85fr 1fr 0.9fr;
      gap: 10px;
      align-items: start;
    }
    @media (max-width: 750px) {
      .follow-grid { grid-template-columns: 1fr; }
    }

    /* PATCH: 2-col on desktop, 1-col on mobile */
    .patch-grid {
      padding: 8px 14px 20px;
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 12px;
    }
    @media (max-width: 650px) {
      .patch-grid { grid-template-columns: 1fr; }
    }

    /* Panic row: 5-col → 3+2 on mobile */
    .panic-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    @media (max-width: 500px) {
      .panic-row { grid-template-columns: repeat(3, 1fr); }
    }

    /* Preset grid: always 5 across */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    /* Audio visualizer CSS */
    .audio-visualizer { display: flex; justify-content: space-around; background: rgba(0,0,0,0.35); padding: 5px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); gap: 4px; }
    .beat-led { flex: 1; padding: 6px 8px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; border-radius: 5px; color: rgba(255,255,255,0.28); transition: background 0.4s ease-out, color 0.4s, box-shadow 0.4s; text-align: center; }
    .beat-led.active-bass { background: linear-gradient(180deg, #ff0055cc, #ff005522); color: #fff; box-shadow: inset 0 0 8px #ff0055; transition: 0s; }
    .beat-led.active-mid  { background: linear-gradient(180deg, #22d3eecc, #22d3ee22); color: #fff; box-shadow: inset 0 0 8px #22d3ee; transition: 0s; }
    .beat-led.active-high { background: linear-gradient(180deg, #ccff00cc, #ccff0022); color: #fff; box-shadow: inset 0 0 8px #ccff00; transition: 0s; }

    @media (max-width: 550px) {
      .status-audiovis { display: none !important; }
      .status-swatches { display: none !important; }
    }
  </style>
  <!-- Served locally from LittleFS (gzip, see WebAPI.h /vendor/* routes) so the
       UI still loads with no internet uplink — e.g. the WiFi AP fallback at a
       venue with no WLAN. Was CDN-hosted (unpkg.com) before 2026-08-15; that
       broke the UI whenever the device had no internet access. -->
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script src="/vendor/babel.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// controller-shared.jsx
const { useState, useRef, useEffect, useCallback, useMemo } = React;

function useKeyboardJoystick(onMove) {
  const keys    = useRef({ u:0, d:0, l:0, r:0, shift:false, alt:false, ctrl:false, meta:false });
  const posRef  = useRef({ x:0, y:0 });
  const lastSent = useRef({ x: 0, y: 0 }); // NEU: Verhindert Netzwerk-Spam & Maus-Konflikte
  const precStart = useRef(0);
  const onMoveRef = useRef(onMove);
  const intervalRef = useRef(null);
  
  useEffect(() => { onMoveRef.current = onMove; });

  useEffect(() => {
    const apply = () => {
      let x = keys.current.r - keys.current.l;
      let y = keys.current.d - keys.current.u;
      const dist = Math.hypot(x, y);
      if (dist > 0) { x /= dist; y /= dist; }

      const isPrecision = keys.current.shift && (keys.current.alt || keys.current.meta || keys.current.ctrl);
      
      if (isPrecision && (x !== 0 || y !== 0)) {
        if (!precStart.current) precStart.current = Date.now();
        const hold = Date.now() - precStart.current;
        const factor = hold < 2000 ? 0.02 : hold < 4000 ? 0.1 : 0.3;
        x *= factor; y *= factor;
      } else {
        precStart.current = 0;
        if (keys.current.shift || keys.current.alt || keys.current.meta || keys.current.ctrl) { 
          x *= 0.2; y *= 0.2; 
        }
      }

      // Only send if the value actually changed
      if (Math.abs(x - lastSent.current.x) > 0.001 || Math.abs(y - lastSent.current.y) > 0.001) {
        lastSent.current = { x, y };
        posRef.current = { x, y };
        onMoveRef.current?.({ x, y });
      }
    };

    const startLoop = () => {
      if (intervalRef.current) return;
      apply();
      intervalRef.current = setInterval(apply, 40);
    };
    const stopLoop = () => {
      if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
      precStart.current = 0;
      // Sicherstellen, dass beim Loslassen ein sauberes 0,0 gesendet wird
      if (Math.abs(lastSent.current.x) > 0.001 || Math.abs(lastSent.current.y) > 0.001) {
        lastSent.current = { x: 0, y: 0 };
        posRef.current = { x: 0, y: 0 };
        onMoveRef.current?.({ x: 0, y: 0 });
      }
    };

    const onDown = (e) => {
      const tag = e.target.tagName.toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      
      const k = keys.current;
      k.shift = e.shiftKey; k.alt = e.altKey; k.ctrl = e.ctrlKey; k.meta = e.metaKey;
      
      let hit = false;
      if (e.code === 'ArrowUp'    || e.code === 'KeyW') { k.u = 1; hit = true; }
      if (e.code === 'ArrowDown'  || e.code === 'KeyS') { k.d = 1; hit = true; }
      if (e.code === 'ArrowLeft'  || e.code === 'KeyA') { k.l = 1; hit = true; }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { k.r = 1; hit = true; }
      
      if (e.code.startsWith('Alt') || e.code.startsWith('Shift')) hit = true;

      if (hit) { 
        e.preventDefault(); 
        if (document.activeElement !== document.body) document.activeElement.blur(); 
        startLoop(); 
      } else if (k.u || k.d || k.l || k.r) {
        apply(); 
      }
    };
    
    const onUp = (e) => {
      const tag = e.target.tagName.toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      
      const k = keys.current;
      if (e.code === 'ArrowUp'    || e.code === 'KeyW') k.u = 0;
      if (e.code === 'ArrowDown'  || e.code === 'KeyS') k.d = 0;
      if (e.code === 'ArrowLeft'  || e.code === 'KeyA') k.l = 0;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') k.r = 0;
      
      k.shift = e.shiftKey; k.alt = e.altKey; k.ctrl = e.ctrlKey; k.meta = e.metaKey;
      
      if (e.code.startsWith('Alt') || e.code.startsWith('Shift')) e.preventDefault();

      const anyHeld = k.u || k.d || k.l || k.r;
      if (!anyHeld) stopLoop();
      else apply();
    };

    const onBlur = () => {
      const k = keys.current;
      k.u = 0; k.d = 0; k.l = 0; k.r = 0;
      k.shift = false; k.alt = false; k.ctrl = false; k.meta = false;
      stopLoop();
    };
    
    window.addEventListener('keydown', onDown);
    window.addEventListener('keyup',   onUp);
    window.addEventListener('blur',    onBlur);
    return () => {
      window.removeEventListener('keydown', onDown);
      window.removeEventListener('keyup',   onUp);
      window.removeEventListener('blur',    onBlur);
      if (intervalRef.current) clearInterval(intervalRef.current);
    };
  }, []);

  return posRef;
}

function StickyJoystick({
  size = 220, thumbColor = '#22d3ee', trackColor = 'rgba(255,255,255,0.10)',
  dotColor = 'rgba(255,255,255,0.16)', ringColor = 'rgba(255,255,255,0.18)',
  showGrid = true, showCross = false, onChange, glow = true, thumbRatio = 0.16,
  keyboardPosRef, externalPos,
}) {
  const ref = useRef(null);
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const visualPosRef = useRef({ x: 0, y: 0 });
  const activeRef = useRef(false);
  const springRef = useRef(null);
  
  const mods = useRef({ shift: false, alt: false, ctrl: false, meta: false });
  const precStart = useRef(0);
  const fireRef = useRef(onChange);

  const thumbPx = Math.round(size * thumbRatio);
  const maxR = size / 2 - thumbPx / 2 - 6;

  useEffect(() => { fireRef.current = onChange; }, [onChange]);

  // Listener for global modifier keys, so the mouse handling picks them up live
  useEffect(() => {
    const handleMod = (e) => {
      mods.current.shift = e.shiftKey; mods.current.alt = e.altKey;
      mods.current.ctrl = e.ctrlKey; mods.current.meta = e.metaKey;
    };
    window.addEventListener('keydown', handleMod);
    window.addEventListener('keyup', handleMod);
    return () => { window.removeEventListener('keydown', handleMod); window.removeEventListener('keyup', handleMod); };
  }, []);

  // Die Super-Schleife: Verarbeitet Tastatur-Sync UND dynamisches Maus-Ramping
  useEffect(() => {
    let raf;
    let lastSent = { x: 0, y: 0 };
    const tick = () => {
      if (!activeRef.current) {
        if (keyboardPosRef) {
          const kp = keyboardPosRef.current;
          if (visualPosRef.current.x !== kp.x || visualPosRef.current.y !== kp.y) {
            visualPosRef.current = { x: kp.x, y: kp.y };
            setPos({ x: kp.x, y: kp.y });
          }
        }
      } else {
        let vx = visualPosRef.current.x;
        let vy = visualPosRef.current.y;
        let nx = vx, ny = vy;

        const m = mods.current;
        const isPrecision = m.shift && (m.alt || m.meta || m.ctrl);

        if (isPrecision) {
          if (!precStart.current) precStart.current = Date.now();
          const hold = Date.now() - precStart.current;
          const factor = hold < 2000 ? 0.02 : hold < 4000 ? 0.1 : 0.3;
          nx *= factor; ny *= factor;
        } else {
          precStart.current = 0;
          if (m.shift || m.alt || m.meta || m.ctrl) {
            nx *= 0.2; ny *= 0.2;
          }
        }

        if (Math.abs(nx - lastSent.x) > 0.001 || Math.abs(ny - lastSent.y) > 0.001) {
          lastSent = { x: nx, y: ny };
          fireRef.current?.({ x: nx, y: ny, pan: Math.round((nx + 1) * 127.5), tilt: Math.round((ny + 1) * 127.5) });
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [keyboardPosRef]);

  const updateFromEvent = useCallback((e) => {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) { dx = dx * maxR / dist; dy = dy * maxR / dist; }
    
    const vx = dx / maxR, vy = dy / maxR;
    visualPosRef.current = { x: vx, y: vy };
    setPos({ x: vx, y: vy });
  }, [maxR]);

  const release = useCallback(() => {
    activeRef.current = false;
    precStart.current = 0;
    cancelAnimationFrame(springRef.current);
    const start = performance.now();
    const from = visualPosRef.current;
    const dur = 180;
    const tick = (t) => {
      if (activeRef.current) return;
      const k = Math.min(1, (t - start) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      const nx = from.x * (1 - e);
      const ny = from.y * (1 - e);
      visualPosRef.current = { x: nx, y: ny };
      setPos({ x: nx, y: ny });
      fireRef.current?.({ x: nx, y: ny, pan: Math.round((nx + 1) * 127.5), tilt: Math.round((ny + 1) * 127.5) });
      if (k < 1) springRef.current = requestAnimationFrame(tick);
    };
    springRef.current = requestAnimationFrame(tick);
  }, []);

  useEffect(() => () => cancelAnimationFrame(springRef.current), []);

  const handlePointerDown = (e) => {
    cancelAnimationFrame(springRef.current);
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    activeRef.current = true;
    updateFromEvent(e);
  };
  const handlePointerMove = (e) => { if (activeRef.current) updateFromEvent(e); };
  const handlePointerUp = (e) => {
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
    release();
  };

  const dots = useMemo(() => {
    if (!showGrid) return null;
    const out = [];
    const step = size / 14;
    const rad = size / 2 - 14;
    for (let y = -6; y <= 6; y++) {
      for (let x = -6; x <= 6; x++) {
        const dx = x * step, dy = y * step;
        if (dx * dx + dy * dy > rad * rad) continue;
        out.push(<circle key={`${x},${y}`} cx={size/2 + dx} cy={size/2 + dy} r={1} fill={dotColor} />);
      }
    }
    return out;
  }, [size, showGrid, dotColor]);

  const tx = size / 2 + pos.x * maxR;
  const ty = size / 2 + pos.y * maxR;

  return (
    <div
      ref={ref}
      onPointerDown={handlePointerDown} onPointerMove={handlePointerMove}
      onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}
      style={{
        width: size, height: size, position: 'relative',
        touchAction: 'none', userSelect: 'none', cursor: activeRef.current ? 'grabbing' : 'grab',
      }}
    >
      <svg width={size} height={size} style={{ position: 'absolute', inset: 0, display: 'block' }}>
        <circle cx={size/2} cy={size/2} r={size/2 - 4} fill={trackColor} stroke={ringColor} strokeWidth={1} />
        {dots}
        {showCross && (
          <g stroke={ringColor} strokeWidth={1}>
            <line x1={size/2} y1={14} x2={size/2} y2={size-14} />
            <line x1={14} y1={size/2} x2={size-14} y2={size/2} />
          </g>
        )}
        {externalPos && (
          <circle
            cx={size/2 + externalPos.x * maxR}
            cy={size/2 + externalPos.y * maxR}
            r={thumbPx/2 - 2}
            fill="none" stroke={thumbColor} strokeWidth={1.5} opacity={0.45}
            strokeDasharray="3 3"
          />
        )}
        {activeRef.current && (
          <circle cx={size/2} cy={size/2} r={maxR}
                  fill="none" stroke={thumbColor} strokeWidth={1} opacity={0.5} strokeDasharray="3 5" />
        )}
        {glow && <circle cx={tx} cy={ty} r={thumbPx} fill={thumbColor} opacity={0.18} filter="blur(8px)" />}
        <circle cx={tx} cy={ty} r={thumbPx/2} fill={thumbColor}
                style={{ filter: glow ? `drop-shadow(0 0 ${thumbPx*0.4}px ${thumbColor})` : 'none' }} />
        <circle cx={tx} cy={ty} r={thumbPx/2 - 4} fill="rgba(255,255,255,0.25)" />
      </svg>
    </div>
  );
}

function RangeSlider({
  value = 0, min = 0, max = 255, onChange,
  height = 8, accent = '#22d3ee', track = 'rgba(255,255,255,0.08)',
  thumb = '#fff', thumbSize = 22, glow = true, vertical = false,
}) {
  const ref = useRef(null);
  const [dragging, setDragging] = useState(false);

  const setFromEvent = useCallback((e) => {
    const el = ref.current; if (!el) return;
    const rect = el.getBoundingClientRect();
    let k;
    if (vertical) { k = 1 - (e.clientY - rect.top) / rect.height; }
    else { k = (e.clientX - rect.left) / rect.width; }
    k = Math.max(0, Math.min(1, k));
    const v = Math.round(min + k * (max - min));
    onChange?.(v);
  }, [min, max, onChange, vertical]);

  const handleDown = (e) => {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    setDragging(true); setFromEvent(e);
  };
  const handleMove = (e) => { if (dragging) setFromEvent(e); };
  const handleUp = (e) => {
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
    setDragging(false);
  };

  const k = (value - min) / (max - min || 1);
  const pct = `${k * 100}%`;

  if (vertical) {
    return (
      <div ref={ref}
        onPointerDown={handleDown} onPointerMove={handleMove} onPointerUp={handleUp} onPointerCancel={handleUp}
        style={{
          width: height, height: 140, position: 'relative', background: track, borderRadius: height / 2,
          touchAction: 'none', userSelect: 'none', cursor: 'pointer',
        }}>
        <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, height: pct, background: accent, borderRadius: height / 2 }} />
        <div style={{ position: 'absolute', left: '50%', bottom: pct, width: thumbSize, height: thumbSize, borderRadius: '50%', background: thumb, transform: 'translate(-50%, 50%)', boxShadow: glow ? `0 0 12px ${accent}` : 'none' }} />
      </div>
    );
  }

  return (
    <div ref={ref}
      onPointerDown={handleDown} onPointerMove={handleMove} onPointerUp={handleUp} onPointerCancel={handleUp}
      style={{
        width: '100%', height: Math.max(height, thumbSize) + 8, position: 'relative',
        touchAction: 'none', userSelect: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center',
      }}>
      <div style={{ position: 'relative', width: '100%', height, background: track, borderRadius: height / 2, overflow: 'visible' }}>
        <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: pct, background: accent, borderRadius: height / 2 }} />
        <div style={{
          position: 'absolute', left: pct, top: '50%',
          width: thumbSize, height: thumbSize, borderRadius: '50%',
          background: thumb, transform: 'translate(-50%, -50%)',
          boxShadow: glow ? `0 0 16px ${accent}, 0 2px 6px rgba(0,0,0,0.4)` : '0 2px 6px rgba(0,0,0,0.4)',
          border: dragging ? `2px solid ${accent}` : '2px solid transparent',
        }} />
      </div>
    </div>
  );
}

function LED({ color = '#22c55e', pulse = false, size = 8 }) {
  return (
    <span style={{
      display: 'inline-block', width: size, height: size, borderRadius: '50%',
      background: color, boxShadow: `0 0 ${size}px ${color}`,
      animation: pulse ? 'led-pulse 1.4s ease-in-out infinite' : 'none',
    }} />
  );
}

function useTelemetry() {
  const [t, setT] = useState({ ping: null, quality: '…' });

  useEffect(() => {
    let active = true;
    const poll = async () => {
      const t0 = performance.now();
      try {
        const r = await fetch('/api/state');
        const ms = Math.round(performance.now() - t0);
        const d = await r.json();
        if (!active) return;
        setT({ ping: ms, quality: ms < 30 ? 'EXC' : ms < 80 ? 'GOOD' : ms < 200 ? 'FAIR' : 'SLOW', raw: d });

        const flash = (id, trigger) => {
          if (trigger) {
            const el = document.getElementById(id);
            if (el) {
              const cn = 'active-' + id.split('-')[1];
              el.classList.remove(cn);
              void el.offsetWidth;
              el.classList.add(cn);
              setTimeout(() => el.classList.remove(cn), 100);
            }
          }
        };
        flash('led-bass', d.trB);
        flash('led-mid', d.trM);
        flash('led-high', d.trH);

      } catch (e) {
        if (active) setT(p => ({ ...p, ping: null, quality: 'OFF', raw: null }));
      }
    };
    poll();
    const id = setInterval(poll, 500);
    return () => { active = false; clearInterval(id); };
  }, []);

  return t;
}

function useTapTempo() {
  const [bpm, setBpm] = useState(120);
  const taps = useRef([]);
  const tap = useCallback(() => {
    const now = performance.now();
    taps.current = [...taps.current.filter((t) => now - t < 2000), now];
    if (taps.current.length >= 2) {
      const intervals = [];

    const ref = useRef(null); const dragRef = useRef(null);

      const rect = ref.current.getBoundingClientRect(); const x = (e.clientX - rect.left) / rect.width; const y = (e.clientY - rect.top) / rect.height;
      if (calibrating) { let nearest = 0, best = Infinity; points.forEach((p, i) => { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < best) { best = d; nearest = i; } }); setActiveMarker(nearest); dragRef.current = nearest; } else { onTap?.(x, y); }

        {hasImage && calibrating && points.map((p, i) => { const active = i === activeMarker; return <div key={i} style={{ position: 'absolute', left: `${p.x * 100}%`, top: `${p.y * 100}%`, width: 28, height: 28, transform: 'translate(-50%, -50%)', borderRadius: '50%', border: `2px solid ${active ? accent : '#fff'}`, background: active ? `${accent}66` : 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 800, color: '#fff', boxShadow: active ? `0 0 16px ${accent}` : '0 0 8px rgba(0,0,0,0.7)', pointerEvents: 'none' }}>{i + 1}</div>; })}

  function FollowspotTab({ accent, joystickSize, state, setState, keyJoyRef, onJoystick, onMapTap }) {
    const fileRef = useRef(null);
    const handleUpload = (e) => {
      const f = e.target.files?.[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas'); const MAX_WIDTH = 250; let width = img.width; let height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.3);
          // New photo -> reset corner markers instead of keeping the old
          // photo's calibration positions, which would silently misalign.
          const nextPoints = [{x:0.1,y:0.1,pan:32767,tilt:32767},{x:0.9,y:0.1,pan:32767,tilt:32767},{x:0.9,y:0.9,pan:32767,tilt:32767},{x:0.1,y:0.9,pan:32767,tilt:32767}];
          fetch('/save_map', { method: 'POST', body: JSON.stringify({ points: nextPoints, image: dataUrl }), headers: { 'Content-Type': 'application/json' } })
            .then((r) => { if (!r.ok) throw new Error('save failed'); showToast('✓ Photo saved — recalibrate the corners', 'ok', 3000); })
            .catch(() => showToast('✗ Photo save failed', 'err'));
          setState((s) => ({ ...s, mapImage: dataUrl, mapHasImage: true, mapPoints: nextPoints }));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(f);
    };
    
    const setPoints = useCallback((updater) => { setState((s) => ({ ...s, mapPoints: typeof updater === 'function' ? updater(s.mapPoints) : updater })); }, [setState]);
    const setActiveMarker = useCallback((idx) => { setState((s) => ({ ...s, mapActiveMarker: idx })); }, [setState]);
    return (
      <div className="follow-grid">

            <div style={{ display: 'flex', justifyContent: 'center', padding: '4px 0' }}><StickyJoystick size={joystickSize + 20} thumbColor={accent} showCross keyboardPosRef={keyJoyRef} externalPos={{ x: (state.pan / 127.5) - 1, y: (state.tilt / 127.5) - 1 }} onChange={(v) => { onJoystick(v); }} /></div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 5 }}><Pill onClick={() => setState((s) => ({ ...s, panRev: !s.panRev }))} active={state.panRev}>Pan Rev</Pill><Pill accent={accent} active onClick={() => { fetch("/joy_in?x=0&y=0"); fetch("/map_go?p=32767&t=32767"); }}>CENTER</Pill><Pill onClick={() => setState((s) => ({ ...s, tiltRev: !s.tiltRev }))} active={state.tiltRev}>Tilt Rev</Pill><Pill>Curve</Pill></div>
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid rgba(255,255,255,0.05)' }}>
              <div style={{ fontSize: 9.5, color: 'rgba(255,255,255,0.45)', letterSpacing: 1.2, fontWeight: 700, textTransform: 'uppercase', marginBottom: 8 }}>Constraints · Pan / Tilt limits</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}><LabeledSlider label="Pan Min" value={state.panMin} onChange={(v) => setState((s) => ({ ...s, panMin: v }))} accent={accent} compact /><LabeledSlider label="Pan Max" value={state.panMax} onChange={(v) => setState((s) => ({ ...s, panMax: v }))} accent={accent} compact /><LabeledSlider label="Tilt Min" value={state.tiltMin} onChange={(v) => setState((s) => ({ ...s, tiltMin: v }))} accent={accent} compact /><LabeledSlider label="Tilt Max" value={state.tiltMax} onChange={(v) => setState((s) => ({ ...s, tiltMax: v }))} accent={accent} compact /></div>
            </div>
          </Panel>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <Panel title="2D Stage mapping" accentDot={accent} padding={12}>
            <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.55)', marginBottom: 8, lineHeight: 1.45 }}>Upload a photo of your stage. Drag corners to calibrate. Then tap anywhere on the photo to send the spot.</div>
            <StageMap accent={accent} hasImage={!!state.mapHasImage} imageSrc={state.mapImage} points={state.mapPoints} setPoints={setPoints} calibrating={state.mapCalibrating} activeMarker={state.mapActiveMarker} setActiveMarker={setActiveMarker} onTap={onMapTap} />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, marginTop: 10 }}>
              <button onClick={() => fileRef.current?.click()} style={{ padding: '10px 0', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 9, color: 'rgba(255,255,255,0.85)', fontWeight: 600, fontSize: 11.5, letterSpacing: 0.6, cursor: 'pointer' }}>{state.mapHasImage ? '↻ Replace photo' : '↑ Upload photo'}</button>
              <input ref={fileRef} type="file" accept="image/*" onChange={handleUpload} style={{ display: 'none' }} />
              <button disabled={!state.mapHasImage} onClick={() => setState((s) => ({ ...s, mapCalibrating: !s.mapCalibrating }))} style={{ padding: '10px 0', background: state.mapCalibrating ? accent : 'rgba(20,184,166,0.16)', border: `1px solid ${state.mapCalibrating ? accent : 'rgba(20,184,166,0.3)'}`, borderRadius: 9, color: state.mapCalibrating ? '#fff' : '#5eead4', fontWeight: 700, fontSize: 11.5, letterSpacing: 0.6, cursor: state.mapHasImage ? 'pointer' : 'not-allowed', opacity: state.mapHasImage ? 1 : 0.3 }}>{state.mapCalibrating ? '✓ Finish calibration' : '⬚ Calibrate corners'}</button>
            </div>
            {state.mapCalibrating && state.mapHasImage && (
              <div style={{ marginTop: 8, padding: '8px 10px', background: 'rgba(244,63,94,0.08)', border: `1px dashed ${accent}`, borderRadius: 8, fontSize: 10.5, color: 'rgba(255,255,255,0.75)' }}>
                <b style={{ color: accent, letterSpacing: 0.5 }}>CALIBRATING {['Top-Left','Top-Right','Bottom-Right','Bottom-Left'][state.mapActiveMarker]}</b>
                <div style={{ marginTop: 4, color: 'rgba(255,255,255,0.55)', lineHeight: 1.4 }}>1. Drag marker to corner. 2. Move real light to that corner with joystick. 3. Tap <i>Save point</i>.</div>
                <button onClick={() => { setState((s) => { const idx = s.mapActiveMarker; const pan16 = Math.round(s.pan * 257); const tilt16 = Math.round(s.tilt * 257); const pts = s.mapPoints.map((p, i) => i === idx ? { ...p, pan: pan16, tilt: tilt16 } : p ); const nextState = { ...s, mapPoints: pts, mapActiveMarker: (idx + 1) % 4 }; fetch('/save_map', { method: 'POST', body: JSON.stringify({ points: pts, image: s.mapImage || '' }), headers: { 'Content-Type': 'application/json' } }).then((r) => { if (!r.ok) throw new Error('save failed'); showToast(`✓ Point ${idx + 1} saved`, 'ok'); }).catch(() => showToast('✗ Map save failed', 'err')); return nextState; }); }} style={{ marginTop: 6, padding: '7px 12px', background: '#15803d', border: 'none', borderRadius: 7, color: '#fff', fontWeight: 700, fontSize: 11, letterSpacing: 0.6, cursor: 'pointer', width: '100%' }}>✓ SAVE POINT {state.mapActiveMarker + 1}</button>
              </div>
            )}

        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <Panel title="Beam controls" padding={12}>
            <LabeledSlider label="Dimmer" value={state.dimmer} onChange={(v) => setState((s) => ({ ...s, dimmer: v }))} accent={accent} compact />
            <LabeledSlider label="Focus" value={state.focus} onChange={(v) => setState((s) => ({ ...s, focus: v }))} accent={accent} compact />
            <LabeledSlider label="Zoom" value={state.zoom} onChange={(v) => setState((s) => ({ ...s, zoom: v }))} accent={accent} compact />
            <div style={{ marginTop: 4 }}><div style={{ fontSize: 9.5, color: 'rgba(255,255,255,0.45)', letterSpacing: 1.2, fontWeight: 700, textTransform: 'uppercase', marginBottom: 5 }}>Color</div><Dropdown value={state.colorBase} onChange={(v) => setState((s) => ({ ...s, colorBase: parseInt(v), colorOff: 0 }))} options={FOLLOWSPOT_COLORS.map((c) => [c.v, c.n])} accent={accent} dense /></div>
            <button onClick={() => setState((s) => ({ ...s, frost: !s.frost }))} style={{ width: '100%', padding: '11px 0', marginTop: 8, background: state.frost ? 'rgba(34,197,94,0.85)' : 'rgba(34,197,94,0.14)', border: '1px solid rgba(34,197,94,0.32)', borderRadius: 10, color: state.frost ? '#fff' : '#86efac', fontWeight: 700, fontSize: 12, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7 }}><LED color="#22c55e" size={7} /> Frost · {state.frost ? 'ON' : 'OFF'}</button>
          </Panel>
          <Panel title="Smart dimmer · auto fade" accentDot="#e83e8c" padding={12}>
            <LabeledSlider label="Dimmer smoothing" value={state.damping} onChange={(v) => setState((s) => ({ ...s, damping: v }))} min={0} max={100} unit="%" accent={accent} compact />
            <div style={{ marginTop: 4, marginBottom: 8 }}><div style={{ fontSize: 9.5, color: 'rgba(255,255,255,0.45)', letterSpacing: 1.2, fontWeight: 700, textTransform: 'uppercase', marginBottom: 5 }}>Auto-fade curve</div><Dropdown value={state.fadeCurve} onChange={(v) => setState((s) => ({ ...s, fadeCurve: parseInt(v) }))} options={[[0, 'Linear'], [3, 'Sine (Soft)'], [1, 'Quadratic (Fast End)'], [2, 'Cubic'], [4, 'S-Curve']]} accent={accent} dense /></div>
            <LabeledSlider label="Fade time" value={state.fadeTime} onChange={(v) => setState((s) => ({ ...s, fadeTime: v }))} min={100} max={10000} step={100} unit="ms" accent={accent} compact />
            <button onClick={() => { fetch(`/autofade?t=${state.fadeTime}&c=${state.fadeCurve}`); setState((s) => ({ ...s, muted: !s.muted })); }} style={{ marginTop: 'auto', width: '100%', padding: '14px 0', background: state.muted ? '#16a34a' : '#7f1d1d', border: 'none', borderRadius: 11, color: '#fff', fontWeight: 800, fontSize: 13, letterSpacing: 1.4, cursor: 'pointer', textTransform: 'uppercase', boxShadow: state.muted ? '0 0 24px rgba(22,163,74,0.32)' : '0 0 24px rgba(127,29,29,0.4)' }}>{state.muted ? '▶ FADE IN (TO SLIDER)' : '◼ FADE OUT (TO BLACK)'}</button>

<script type="text/babel">
// horizon-patch.jsx
(function () {
  const { useState, useEffect } = React;

  function FirmwareInfo({ colStyle, labelStyle }) {
    const [info, setInfo] = useState('loading…');
    useEffect(() => {
      fetch('/api/state').then(r => r.json()).then(d => setInfo(`ESP32 · BPM engine active · ${d.bpm || 0} BPM`)).catch(() => setInfo('ESP32 · Horizon firmware'));
    }, []);
    return (
      <div style={{ ...colStyle, fontSize: 10.5, color: 'rgba(255,255,255,0.4)' }}>
        <div style={labelStyle}>Firmware status</div>
        <div style={{ fontFamily: '"JetBrains Mono",monospace', fontSize: 10, color: 'rgba(255,255,255,0.5)', marginBottom: 6 }}>{info}</div>
        <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.3)' }}>UI: index.html · LittleFS · Horizon design system</div>
      </div>
    );
  }

  function PatchTab({ accent }) {
    const [fixtures, setFixtures] = useState([{ a: 1, ip: 0, it: 0, ph: 0 }]);
    const [fanStart, setFanStart] = useState(0); const [fanEnd, setFanEnd] = useState(360);
    const [status, setStatus] = useState(''); const [ssid, setSsid] = useState(''); const [pass, setPass] = useState('');

    useEffect(() => { fetch('/api/patch').then(r => r.json()).then(d => { if (d && d.length) setFixtures(d); }).catch(() => {}); }, []);

    function addFixture() { if (fixtures.length >= 8) return; const last = fixtures[fixtures.length - 1]; setFixtures([...fixtures, { a: last.a + 17, ip: 0, it: 0, ph: 0 }]); }
    function removeFixture(i) { setFixtures(fixtures.filter((_, idx) => idx !== i)); }
    function updateFix(i, key, val) { setFixtures(fixtures.map((f, idx) => idx === i ? { ...f, [key]: val } : f)); }
    function applyFan() { const step = fixtures.length === 1 ? 0 : (fanEnd - fanStart) / fixtures.length; setFixtures(fixtures.map((f, i) => ({ ...f, ph: Math.round(fanStart + step * i) }))); }
    function savePatch() { const params = new URLSearchParams(); params.append('n', fixtures.length); fixtures.forEach((f, i) => { params.append('a' + i, f.a); params.append('ip' + i, f.ip); params.append('it' + i, f.it); params.append('ph' + i, f.ph); }); fetch('/save_patch', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params.toString() }).then(() => { showToast('✓ Patch saved to controller', 'ok'); haptic(12); }).catch(() => showToast('✗ Patch save failed', 'err')); }
    function saveWifi() { if (!ssid) { showToast('Enter SSID first', 'err'); return; } fetch(`/set_wifi?s=${encodeURIComponent(ssid)}&p=${encodeURIComponent(pass)}`).then(() => showToast('WiFi saved — restarting…', 'info', 3000)).catch(() => showToast('✗ WiFi save failed', 'err')); }

    const colStyle = { padding: '8px 12px', background: 'rgba(255,255,255,0.025)', border: '1px solid rgba(255,255,255,0.05)', borderRadius: 14 };
    const labelStyle = { fontSize: 10, fontWeight: 700, letterSpacing: 1.2, textTransform: 'uppercase', color: 'rgba(255,255,255,0.45)', marginBottom: 8 };
    const inputStyle = { padding: '9px 10px', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: 9, color: '#fff', fontSize: 12, width: '100%', fontFamily: 'inherit' };
    const numStyle = { ...inputStyle, width: 72 }; const chkStyle = { width: 20, height: 20, cursor: 'pointer', accentColor: accent };

    return (
      <div className="patch-grid">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={colStyle}>
            <div style={labelStyle}>Fixture Matrix · up to 8 heads</div>
            {fixtures.map((f, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8, padding: '10px 12px', background: 'rgba(255,255,255,0.022)', borderRadius: 10, border: '1px solid rgba(255,255,255,0.04)' }}>
                <span style={{ fontSize: 11, fontWeight: 700, color: accent, width: 22, flexShrink: 0, fontFamily: '"JetBrains Mono",monospace' }}>#{i + 1}</span>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, flex: 1, flexWrap: 'wrap' }}>
                  <label style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: 'rgba(255,255,255,0.65)' }}>DMX Addr<input type="number" min="1" max="512" value={f.a} onChange={e => updateFix(i, 'a', +e.target.value)} style={numStyle} /></label>
                  <label style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: 'rgba(255,255,255,0.65)' }}><input type="checkbox" checked={!!f.ip} onChange={e => updateFix(i, 'ip', e.target.checked ? 1 : 0)} style={chkStyle} /> Inv Pan</label>
                  <label style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: 'rgba(255,255,255,0.65)' }}><input type="checkbox" checked={!!f.it} onChange={e => updateFix(i, 'it', e.target.checked ? 1 : 0)} style={chkStyle} /> Inv Tilt</label>
                  <label style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: 'rgba(255,255,255,0.65)' }}>Phase °<input type="number" min="0" max="360" value={f.ph} onChange={e => updateFix(i, 'ph', +e.target.value)} style={numStyle} /></label>
                </div>
                {i > 0 && <button onClick={() => removeFixture(i)} style={{ padding: '6px 12px', background: 'rgba(127,29,29,0.5)', border: '1px solid rgba(220,38,38,0.35)', borderRadius: 8, color: '#fca5a5', fontWeight: 700, fontSize: 11, cursor: 'pointer' }}>✕</button>}
              </div>
            ))}
            <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
              {fixtures.length < 8 && <button onClick={addFixture} style={{ padding: '10px 20px', background: 'rgba(34,197,94,0.14)', border: '1px solid rgba(34,197,94,0.3)', borderRadius: 10, color: '#86efac', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>+ Add fixture</button>}
              <button onClick={savePatch} style={{ flex: 1, padding: '10px 0', background: accent, border: 'none', borderRadius: 10, color: '#fff', fontWeight: 800, fontSize: 13, letterSpacing: 0.8, cursor: 'pointer', boxShadow: `0 0 20px ${accent}44` }}>SAVE PATCH TO CONTROLLER</button>
            </div>
            {status && <div style={{ marginTop: 8, fontSize: 11, color: '#86efac', textAlign: 'center' }}>{status}</div>}
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={colStyle}>
            <div style={labelStyle}>Phase fanning</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 10 }}>
              <div><div style={{ fontSize: 10, color: 'rgba(255,255,255,0.45)', marginBottom: 4 }}>Start °</div><input type="number" value={fanStart} onChange={e => setFanStart(+e.target.value)} style={numStyle} /></div>
              <div><div style={{ fontSize: 10, color: 'rgba(255,255,255,0.45)', marginBottom: 4 }}>End °</div><input type="number" value={fanEnd} onChange={e => setFanEnd(+e.target.value)} style={numStyle} /></div>
            </div>
            <svg width="100%" viewBox="0 0 200 110" style={{ marginBottom: 8 }}>
              <rect width="200" height="110" fill="rgba(0,0,0,0.3)" rx="8"/>
              {fixtures.map((f, i) => { const ang = (f.ph - 90) * Math.PI / 180; const x2 = 100 + Math.cos(ang) * 80; const y2 = 55 + Math.sin(ang) * 80; return <line key={i} x1="100" y1="55" x2={x2} y2={y2} stroke={`hsl(${(i * 360 / Math.max(fixtures.length,1)) | 0},80%,65%)`} strokeWidth="2" strokeLinecap="round" opacity="0.85" />; })}
              <circle cx="100" cy="55" r="5" fill="rgba(255,255,255,0.6)"/><text x="100" y="106" textAnchor="middle" fill="rgba(255,255,255,0.3)" fontSize="9">{fixtures.length} fixture{fixtures.length !== 1 ? 's' : ''} · {fanStart}° → {fanEnd}°</text>
            </svg>
            <button onClick={applyFan} style={{ width: '100%', padding: '10px 0', background: 'rgba(167,139,250,0.18)', border: '1px solid rgba(167,139,250,0.3)', borderRadius: 10, color: '#c4b5fd', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>⤢ Apply Fan</button>
          </div>
          <div style={colStyle}>
            <div style={labelStyle}>WiFi settings</div>
            <div style={{ marginBottom: 8 }}><div style={{ fontSize: 10, color: 'rgba(255,255,255,0.45)', marginBottom: 4 }}>SSID</div><input type="text" value={ssid} onChange={e => setSsid(e.target.value)} placeholder="Network name" style={inputStyle} /></div>
            <div style={{ marginBottom: 10 }}><div style={{ fontSize: 10, color: 'rgba(255,255,255,0.45)', marginBottom: 4 }}>Password</div><input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Password" style={inputStyle} /></div>
            <button onClick={saveWifi} style={{ width: '100%', padding: '10px 0', background: 'rgba(59,130,246,0.16)', border: '1px solid rgba(59,130,246,0.35)', borderRadius: 10, color: '#93c5fd', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>Save & Restart</button>
          </div>
          <FirmwareInfo colStyle={colStyle} labelStyle={labelStyle} />
          <div style={{ ...colStyle, fontSize: 10.5, color: 'rgba(255,255,255,0.4)', lineHeight: 1.7 }}>
            <div style={labelStyle}>DMX channels</div>
            {[['CH1','Dimmer'],['CH2','Strobe'],['CH3','Pan'],['CH4','Tilt'],['CH5','Motor speed'],['CH6','Color'],['CH7','Static gobo'],['CH8','Rot. gobo'],['CH9','Gobo idx / rot'],['CH10','Prism'],['CH11','Prism rot'],['CH12','Frost'],['CH13','Focus'],['CH14','Zoom'],['CH15','Pan fine'],['CH16','Tilt fine'],['CH17','Macro']].map(([ch, name]) => (
              <div key={ch} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 2 }}><span style={{ fontFamily: '"JetBrains Mono",monospace', color: accent, fontSize: 10 }}>{ch}</span><span>{name}</span></div>
            ))}
          </div>
        </div>
      </div>
    );
  }
  window.HorizonPatchTab = PatchTab;
})();
</script>

<script type="text/babel">
// ROOT APP
(function () {
  const { useState, useEffect, useRef, useCallback } = React;
  const ACCENT_DEFAULT = '#f43f5e';
  const tfWait = {}, tfPending = {};
  async function tFetch(url, id, delay = 40) {
    if (tfWait[id]) { tfPending[id] = url; return; }
    tfWait[id] = true;
    try { await fetch(url); } catch(e) {}
    setTimeout(() => {
      tfWait[id] = false;
      if (tfPending[id]) { const next = tfPending[id]; tfPending[id] = null; tFetch(next, id, delay); }
    }, delay);
  }

  const CH = { DIMMER:1, STROBE:2, PAN:3, TILT:4, SPEED:5, COLOR:6, GOBO:7, GOBO_ROT:8, GOBO_IDX:9, PRISM:10, PRISM_ROT:11, FROST:12, FOCUS:13, ZOOM:14, PAN_FINE:15, TILT_FINE:16, MACRO:17 };
  const COLORS = [{n:'White',v:0},{n:'W/R',v:50},{n:'Red',v:5},{n:'R/Y',v:55},{n:'Yellow',v:10},{n:'Y/B',v:60},{n:'Blue',v:15},{n:'B/G',v:65},{n:'Green',v:20},{n:'G/P',v:70},{n:'Purple',v:25},{n:'P/A',v:75},{n:'Amber',v:30},{n:'A/C',v:80},{n:'Cyan',v:35},{n:'C/E',v:85},{n:'Emerald',v:40},{n:'E/O',v:90},{n:'Orange',v:45},{n:'O/W',v:95}];

 function App() {
    const [tab, setTab] = useState('LIVE');
    const [night, setNight] = useState(() => localStorage.getItem('hz_night') === '1');
    
    // HIER IST DIE KORREKTE, UMBENANNTE VARIABLE
    const [accent, setAccent] = useState(() => localStorage.getItem('hz_accent') || ACCENT_DEFAULT);

    const [muted, setMuted] = useState(false);
    const [micOn, setMicOn] = useState(false);
    const [hwSens, setHwSens] = useState(() => { const saved = parseInt(localStorage.getItem('hz_hwsens')); return isNaN(saved) ? 50 : saved; });
    const [fixtureCount, setFixtureCount] = useState(1);

    const [state, setState] = useState({
      pan: 127, tilt: 127, panFine: 0, tiltFine: 0, motorSpeed: 128,
      dimmer: 0, strobe: 0, focus: 128, zoom: 255, frost: false, prism: false, prismRot: 0,
      colorBase: 0, colorOff: 0, color: 0, sgoboBase: 0, sgoboOff: 0, rgoboBase: 0, rgoboOff: 0, goboRot: 0, macro: 0, master: 100,
      joySpeed: 2000, joyCurve: 20, joyMomentum: 50, panRev: false, tiltRev: false, panMin: 0, panMax: 255, tiltMin: 0, tiltMax: 255,
      presetNames: Array(10).fill(''), presetActive: null, presetSaveSlot: 1, presetSaveName: '',
      chaserTrigger: 0, chaserSync: 3, chaserHold: 2000, chaserFadeMode: 0, chaserFade: 2000, chaserFadeSync: 3, chaserOrder: 0, chaserFrom: 0, chaserTo: 3, showRunning: false, transMode: 0,
      fxRunning: false, fxType: 1, fxRot: 0, fxMode: 0, fxCurve: 3, fxMS: 100, fxSS: 0, fxSE: 255, fxZS: 0, fxZE: 255, fxTr: 0, fxSy: 3,
      dimFxRunning: false, dimSt: 0, dimEn: 255, dimMo: 0, dimCu: 3, dimSp: 2000, dimTr: 0, dimSy: 3,
      grFxRunning: false, grSt: 135, grEn: 190, grMo: 0, grCu: 3, grSp: 2000, grTr: 0, grSy: 3,
      prFxRunning: false, prSt: 193, prEn: 255, prMo: 0, prCu: 3, prSp: 2000, prTr: 0, prSy: 3,
      colFxRunning: false, colSt: 0, colEn: 19, colHo: 2000, colTr: 0, colSy: 3,
      sgFxRunning: false, sgSt: 0, sgEn: 9, sgHo: 2000, sgTr: 0, sgSy: 3, sgSc: 0,
      rgFxRunning: false, rgSt: 0, rgEn: 6, rgHo: 2000, rgTr: 0, rgSy: 3, rgSc: 0,
      damping: 50, fadeTime: 2000, fadeCurve: 3,
      mapPoints: [{x:0.1,y:0.1,pan:32767,tilt:32767},{x:0.9,y:0.1,pan:32767,tilt:32767},{x:0.9,y:0.9,pan:32767,tilt:32767},{x:0.1,y:0.9,pan:32767,tilt:32767}],
      mapCalibrating: false, mapActiveMarker: 0, mapImage: '', mapHasImage: false, openWhite: false,
    });

    const keyJoyRef = useKeyboardJoystick(useCallback((v) => {
      tFetch(`/joy_in?x=${v.x.toFixed(3)}&y=${v.y.toFixed(3)}`, 'joy', 40);
    }, []));

    const [bpm, tap, setBpm] = useTapTempo();
    const beat = useBeatPulse(bpm);
    const tele = useTelemetry();

    // The single, correct declaration (do not duplicate elsewhere)
    const handleAccentChange = useCallback((hex) => { setAccent(hex); try { localStorage.setItem('hz_accent', hex); } catch(e) {} }, []);

const isReceiving = useRef(false);
    const prevRef = useRef({});

    useEffect(() => {
      const sync = async () => {
        try {
          const r = await fetch('/api/get_dmx'); const d = await r.json();
          if (d.bpm) setBpm(d.bpm);

          isReceiving.current = true; // set flag: we're currently receiving data

          setState(prev => {
            const next = { ...prev };
            const color = d[CH.COLOR]; const colorEntry = COLORS.find(c => c.v === color);
            next.dimmer = d[CH.DIMMER] ?? prev.dimmer; next.strobe = d[CH.STROBE] ?? prev.strobe; next.pan = d[CH.PAN] ?? prev.pan; next.tilt = d[CH.TILT] ?? prev.tilt; next.motorSpeed = d[CH.SPEED] ?? prev.motorSpeed; next.goboRot = d[CH.GOBO_IDX] ?? prev.goboRot; next.prism = (d[CH.PRISM] ?? 0) > 127; next.prismRot = d[CH.PRISM_ROT] ?? prev.prismRot; next.frost = (d[CH.FROST] ?? 0) > 127; next.focus = d[CH.FOCUS] ?? prev.focus; next.zoom = d[CH.ZOOM] ?? prev.zoom; next.panFine = d[CH.PAN_FINE] ?? prev.panFine; next.tiltFine = d[CH.TILT_FINE] ?? prev.tiltFine; next.macro = d[CH.MACRO] ?? prev.macro;
            if (colorEntry) next.colorBase = colorEntry.v;
            if (d.pn) next.presetNames = d.pn; if (d.pr > 0) next.presetActive = d.pr;
            if (d.mB !== undefined) next.master = Math.round(d.mB * 100);
            if (d.dSm !== undefined) next.damping = d.dSm;
            if (d.fA !== undefined) {
              next.fxRunning = !!d.fA; next.fxType = d.fT ?? prev.fxType; next.fxRot = d.fR ?? prev.fxRot; next.fxTr = d.fTr ?? prev.fxTr; next.fxSy = d.fSy ?? prev.fxSy; next.fxSS = d.fSS ?? prev.fxSS; next.fxSE = d.fSE ?? prev.fxSE; next.fxZS = d.fZS ?? prev.fxZS; next.fxZE = d.fZE ?? prev.fxZE; next.fxMode = d.fMM ?? prev.fxMode; next.fxCurve = d.fMC ?? prev.fxCurve; next.fxMS = d.fMS ?? prev.fxMS;
              next.dimFxRunning = !!d.dA; next.dimSt = d.dSt ?? prev.dimSt; next.dimEn = d.dEn ?? prev.dimEn; next.dimMo = d.dMo ?? prev.dimMo; next.dimCu = d.dCu ?? prev.dimCu; next.dimSp = d.dSp ?? prev.dimSp; next.dimTr = d.dTr ?? prev.dimTr; next.dimSy = d.dSy ?? prev.dimSy;
              next.grFxRunning = !!d.grA; next.grSt = d.grSt ?? prev.grSt; next.grEn = d.grEn ?? prev.grEn; next.grMo = d.grMo ?? prev.grMo; next.grCu = d.grCu ?? prev.grCu; next.grSp = d.grSp ?? prev.grSp; next.grTr = d.grTr ?? prev.grTr; next.grSy = d.grSy ?? prev.grSy;
              next.prFxRunning = !!d.prA; next.prSt = d.prSt ?? prev.prSt; next.prEn = d.prEn ?? prev.prEn; next.prMo = d.prMo ?? prev.prMo; next.prCu = d.prCu ?? prev.prCu; next.prSp = d.prSp ?? prev.prSp; next.prTr = d.prTr ?? prev.prTr; next.prSy = d.prSy ?? prev.prSy;
              next.colFxRunning = !!d.cA; next.colSt = d.cSt ?? prev.colSt; next.colEn = d.cEn ?? prev.colEn; next.colHo = d.cHo ?? prev.colHo; next.colTr = d.cTr ?? prev.colTr; next.colSy = d.cSy ?? prev.colSy;
              next.sgFxRunning = !!d.sgA; next.sgSt = d.sgSt ?? prev.sgSt; next.sgEn = d.sgEn ?? prev.sgEn; next.sgHo = d.sgHo ?? prev.sgHo; next.sgTr = d.sgTr ?? prev.sgTr; next.sgSy = d.sgSy ?? prev.sgSy; next.sgSc = d.sgSc ?? prev.sgSc;
              next.rgFxRunning = !!d.rgA; next.rgSt = d.rgSt ?? prev.rgSt; next.rgEn = d.rgEn ?? prev.rgEn; next.rgHo = d.rgHo ?? prev.rgHo; next.rgTr = d.rgTr ?? prev.rgTr; next.rgSy = d.rgSy ?? prev.rgSy; next.rgSc = d.rgSc ?? prev.rgSc;
              next.showRunning = !!d.chA; next.chaserTrigger = d.chTr ?? prev.chaserTrigger; next.chaserSync = d.chSy ?? prev.chaserSync; next.chaserOrder = d.chOrd ?? prev.chaserOrder; next.chaserFrom = d.chSS ?? prev.chaserFrom; next.chaserTo = d.chES ?? prev.chaserTo; next.chaserFade = d.chF ?? prev.chaserFade; next.chaserHold = d.chH ?? prev.chaserHold; next.chaserFadeMode = d.chFTr ?? prev.chaserFadeMode; next.chaserFadeSync = d.chFSy ?? prev.chaserFadeSync; next.transMode = d.dip ?? prev.transMode;
            }
            if (d.fO !== undefined) { const nowMuted = d.fO === 1; setMuted(nowMuted); }
            if (d.hwA !== undefined) setMicOn(d.hwA === 1);
            return next;
          });

          // Longer timeout (300ms) for slow browser engines, so the UI has reliably finished rendering
          setTimeout(() => { isReceiving.current = false; }, 300);
        } catch(e) {}
      };
      sync(); const id = setInterval(sync, 2000); return () => clearInterval(id);
    }, []);

    useEffect(() => {
      const s = state; const p = prevRef.current;
      const batch = {};
      
      const track = (ch, val) => { 
        if (p['ch'+ch] !== val) { 
          if (!isReceiving.current) batch[ch] = val; 
          p['ch'+ch] = val; 
        } 
      };
      
      track(CH.DIMMER, s.dimmer); track(CH.STROBE, s.strobe); track(CH.SPEED, s.motorSpeed);
      track(CH.COLOR, s.colorBase + s.colorOff); track(CH.GOBO, s.sgoboBase + s.sgoboOff); track(CH.GOBO_ROT, s.rgoboBase + s.rgoboOff); track(CH.GOBO_IDX, s.goboRot);
      track(CH.PRISM, s.prism ? 200 : 0); track(CH.PRISM_ROT, s.prismRot); track(CH.FROST, s.frost ? 200 : 0); track(CH.FOCUS, s.focus); track(CH.ZOOM, s.zoom); track(CH.PAN_FINE, s.panFine); track(CH.TILT_FINE, s.tiltFine); track(CH.MACRO, s.macro);
      
      if (Object.keys(batch).length > 0) { const params = new URLSearchParams(); Object.entries(batch).forEach(([ch, v]) => params.append('c' + ch, v)); fetch('/set_all?' + params.toString()).catch(() => {}); }
      
      if (p.fxState !== JSON.stringify([s.fxRunning, s.fxType, s.fxRot, s.fxMode, s.fxCurve, s.fxMS, s.fxSS, s.fxSE, s.fxZS, s.fxZE, s.fxTr, s.fxSy])) { p.fxState = JSON.stringify([s.fxRunning, s.fxType, s.fxRot, s.fxMode, s.fxCurve, s.fxMS, s.fxSS, s.fxSE, s.fxZS, s.fxZE, s.fxTr, s.fxSy]); if(!isReceiving.current) tFetch(`/fx?a=${s.fxRunning?1:0}&t=${s.fxType}&r=${s.fxRot}&ss=${s.fxSS}&se=${s.fxSE}&zs=${s.fxZS}&ze=${s.fxZE}&mm=${s.fxMode}&mc=${s.fxCurve}&ms=${s.fxMS}&tr=${s.fxTr}&sy=${s.fxSy}`, 'fx'); }
      if (p.dimFxState !== JSON.stringify([s.dimFxRunning, s.dimSt, s.dimEn, s.dimMo, s.dimCu, s.dimSp, s.dimTr, s.dimSy])) { p.dimFxState = JSON.stringify([s.dimFxRunning, s.dimSt, s.dimEn, s.dimMo, s.dimCu, s.dimSp, s.dimTr, s.dimSy]); if(!isReceiving.current) tFetch(`/modfx?pfx=dim&a=${s.dimFxRunning?1:0}&st=${s.dimSt}&en=${s.dimEn}&sp=${s.dimSp}&mo=${s.dimMo}&cu=${s.dimCu}&tr=${s.dimTr}&sy=${s.dimSy}`, 'mfx_dim'); }
      if (p.grFxState !== JSON.stringify([s.grFxRunning, s.grSt, s.grEn, s.grMo, s.grCu, s.grSp, s.grTr, s.grSy])) { p.grFxState = JSON.stringify([s.grFxRunning, s.grSt, s.grEn, s.grMo, s.grCu, s.grSp, s.grTr, s.grSy]); if(!isReceiving.current) tFetch(`/modfx?pfx=gr&a=${s.grFxRunning?1:0}&st=${s.grSt}&en=${s.grEn}&sp=${s.grSp}&mo=${s.grMo}&cu=${s.grCu}&tr=${s.grTr}&sy=${s.grSy}`, 'mfx_gr'); }
      if (p.prFxState !== JSON.stringify([s.prFxRunning, s.prSt, s.prEn, s.prMo, s.prCu, s.prSp, s.prTr, s.prSy])) { p.prFxState = JSON.stringify([s.prFxRunning, s.prSt, s.prEn, s.prMo, s.prCu, s.prSp, s.prTr, s.prSy]); if(!isReceiving.current) tFetch(`/modfx?pfx=pr&a=${s.prFxRunning?1:0}&st=${s.prSt}&en=${s.prEn}&sp=${s.prSp}&mo=${s.prMo}&cu=${s.prCu}&tr=${s.prTr}&sy=${s.prSy}`, 'mfx_pr'); }
      if (p.colFxState !== JSON.stringify([s.colFxRunning, s.colSt, s.colEn, s.colHo, s.colTr, s.colSy])) { p.colFxState = JSON.stringify([s.colFxRunning, s.colSt, s.colEn, s.colHo, s.colTr, s.colSy]); if(!isReceiving.current) tFetch(`/colfx?a=${s.colFxRunning?1:0}&st=${s.colSt}&en=${s.colEn}&ho=${s.colHo}&tr=${s.colTr}&sy=${s.colSy}`, 'cfx'); }
      if (p.sgFxState !== JSON.stringify([s.sgFxRunning, s.sgSt, s.sgEn, s.sgHo, s.sgTr, s.sgSy, s.sgSc])) { p.sgFxState = JSON.stringify([s.sgFxRunning, s.sgSt, s.sgEn, s.sgHo, s.sgTr, s.sgSy, s.sgSc]); if(!isReceiving.current) tFetch(`/sgobfx?a=${s.sgFxRunning?1:0}&st=${s.sgSt}&en=${s.sgEn}&ho=${s.sgHo}&tr=${s.sgTr}&sy=${s.sgSy}&sc=${s.sgSc}`, 'sgfx'); }
      if (p.rgFxState !== JSON.stringify([s.rgFxRunning, s.rgSt, s.rgEn, s.rgHo, s.rgTr, s.rgSy, s.rgSc])) { p.rgFxState = JSON.stringify([s.rgFxRunning, s.rgSt, s.rgEn, s.rgHo, s.rgTr, s.rgSy, s.rgSc]); if(!isReceiving.current) tFetch(`/rgobfx?a=${s.rgFxRunning?1:0}&st=${s.rgSt}&en=${s.rgEn}&ho=${s.rgHo}&tr=${s.rgTr}&sy=${s.rgSy}&sc=${s.rgSc}`, 'rgfx'); }
      if (p.chaserState !== JSON.stringify([s.showRunning, s.chaserTrigger, s.chaserSync, s.chaserOrder, s.chaserFrom, s.chaserTo, s.chaserFade, s.chaserHold, s.chaserFadeMode, s.chaserFadeSync])) { p.chaserState = JSON.stringify([s.showRunning, s.chaserTrigger, s.chaserSync, s.chaserOrder, s.chaserFrom, s.chaserTo, s.chaserFade, s.chaserHold, s.chaserFadeMode, s.chaserFadeSync]); if(!isReceiving.current) tFetch(`/chaser?act=${s.showRunning?1:0}&start=${s.chaserFrom}&end=${s.chaserTo}&fade=${s.chaserFade}&hold=${s.chaserHold}&trg=${s.chaserTrigger}&sync=${s.chaserSync}&ord=${s.chaserOrder}&f_trg=${s.chaserFadeMode}&f_sync=${s.chaserFadeSync}`, 'ch_tog'); }
      
      if (p.transMode !== s.transMode) { p.transMode = s.transMode; if(!isReceiving.current) tFetch('/trans?dip=' + s.transMode, 'trans'); }
      if (p.master !== s.master) { p.master = s.master; if(!isReceiving.current) tFetch(`/masterdim?v=${s.master}`, 'master'); }
      if (p.damping !== s.damping) { p.damping = s.damping; if(!isReceiving.current) tFetch('/smooth?v=' + s.damping, 'smth'); }
      
      // KORREKTUR: joyCurve durch 10 teilen, bevor es an den ESP32 geht!
      const crvFixed = (s.joyCurve / 10).toFixed(1);
      const joyKey = `${s.joySpeed}|${crvFixed}|${s.joyMomentum}|${s.panRev?1:0}|${s.tiltRev?1:0}|${s.panMin}|${s.panMax}|${s.tiltMin}|${s.tiltMax}`;
      
      if (p.joyKey !== joyKey) { 
        p.joyKey = joyKey; 
        if(!isReceiving.current) tFetch(`/joy_cfg?spd=${s.joySpeed}&crv=${crvFixed}&mom=${s.joyMomentum}&pr=${s.panRev?1:0}&tr=${s.tiltRev?1:0}&pmin=${s.panMin}&pmax=${s.panMax}&tmin=${s.tiltMin}&tmax=${s.tiltMax}`, 'joy_cfg'); 
      }
    }, [state]);

    const recallPreset = useCallback((slot) => { fetch('/recall?slot=' + slot).then(() => {}); setState(s => ({ ...s, presetActive: slot })); }, []);
    const savePreset = useCallback((slot, name) => { fetch(`/save?slot=${slot}&n=${encodeURIComponent(name)}`).then(() => { setState(s => { const pn = [...s.presetNames]; pn[slot - 1] = name; return { ...s, presetNames: pn }; }); showToast(`✓ Preset ${slot} saved — "${name}"`, 'ok'); haptic(12); }).catch(() => showToast('✗ Save failed', 'err')); }, []);
    const killAllFx = useCallback(() => { fetch('/kill_fx'); setState(s => ({ ...s, fxRunning: false, dimFxRunning: false, grFxRunning: false, prFxRunning: false, colFxRunning: false, sgFxRunning: false, rgFxRunning: false, showRunning: false, presetActive: null })); }, []);
    
    const handleMute = useCallback(() => {
      fetch(`/autofade?t=${state.fadeTime}&c=${state.fadeCurve}`);
      setMuted(m => !m);
    }, [state.fadeTime, state.fadeCurve]);

    const handleMic = useCallback(() => { const next = !micOn; fetch(`/hwaudio?en=${next ? 1 : 0}&sens=${hwSens}`); setMicOn(next); }, [micOn, hwSens]);
    useEffect(() => { try { localStorage.setItem('hz_hwsens', hwSens); } catch(e) {} if (micOn) { fetch(`/hwaudio?en=1&sens=${hwSens}`).catch(() => {}); } }, [hwSens]);
    const tapWithFirmware = useCallback(() => { tap(); fetch('/beat'); }, [tap]);
    const hardSync = useCallback(() => { fetch('/sync'); }, []);
    const handleJog = useCallback((v) => { tFetch('/jog?v=' + v, 'jog'); }, []);
    const releaseJog = useCallback(() => { tFetch('/jog?v=0', 'jog'); }, []);
    
    // MOUSE JOYSTICK HANDLER
    const joystickHandler = useCallback((v) => { 
      tFetch(`/joy_in?x=${v.x.toFixed(3)}&y=${v.y.toFixed(3)}`, 'joy', 40); 
    }, []);

    const handleMapTap = useCallback((nx, ny) => { const p = state.mapPoints; const topPan = p[0].pan + (p[1].pan - p[0].pan) * nx; const botPan = p[3].pan + (p[2].pan - p[3].pan) * nx; const finalPan = topPan + (botPan - topPan) * ny; const topTilt = p[0].tilt + (p[1].tilt - p[0].tilt) * nx; const botTilt = p[3].tilt + (p[2].tilt - p[3].tilt) * nx; const finalTilt = topTilt + (botTilt - topTilt) * ny; tFetch(`/map_go?p=${Math.max(0, Math.min(65535, Math.round(finalPan)))}&t=${Math.max(0, Math.min(65535, Math.round(finalTilt)))}`, 'map', 40); }, [state.mapPoints]);

    useEffect(() => {
      fetch('/load_map').then(r => r.ok ? r.json() : null).then(json => { if (json && json.image) { setState(s => ({ ...s, mapImage: json.image, mapHasImage: true, mapPoints: json.points || s.mapPoints })); } }).catch(() => {});
      fetch('/api/patch').then(r => r.ok ? r.json() : null).then(data => { if (Array.isArray(data) && data.length > 0) setFixtureCount(data.length); }).catch(() => {});
    }, []);

    // Uses the instant /bump override (same mechanism as Blinder/Strobe), not
    // /set_all, which runs through dimmer smoothing — a panic button must cut
    // immediately regardless of the smoothing setting. The dimmer value itself
    // is never touched, so there's nothing to restore on release.
    const handleBlackoutOn = useCallback(() => { fetch('/bump?t=blackout&s=1').catch(() => {}); setState(s => ({ ...s, blackout: true })); }, []);
    const handleBlackoutOff = useCallback(() => { fetch('/bump?t=blackout&s=0').catch(() => {}); setState(s => ({ ...s, blackout: false })); }, []);

    return (
      <div style={{ width: '100%', height: '100vh', display: 'flex', flexDirection: 'column', background: night ? '#0a0606' : '#0b0b0e', color: '#fff', fontFamily: '"Inter", -apple-system, system-ui, sans-serif', overflow: 'hidden', filter: night ? 'brightness(0.85) sepia(0.5) hue-rotate(-50deg) saturate(2.2)' : 'none', position: 'relative' }}>
        <StatusBar accent={accent} onAccentChange={handleAccentChange} night={night} onNightToggle={() => setNight(n => { const next = !n; try { localStorage.setItem('hz_night', next ? '1' : '0'); } catch(e) {} return next; })} telemetry={tele} bpm={bpm} micOn={micOn} fixtureCount={fixtureCount} />
        <Tabs tab={tab} setTab={setTab} accent={accent} tabs={['LIVE', 'FOLLOWSPOT', 'PROGRAMMER', 'PATCH']} />
        <div className="tab-scroll">
          {tab === 'LIVE' && <HorizonLiveTab accent={accent} joystickSize={195} state={state} setState={setState} bpm={bpm} tap={tapWithFirmware} muted={muted} onUnmute={handleMute} micOn={micOn} onMicToggle={handleMic} hwSens={hwSens} setHwSens={(v) => { setHwSens(v); }} onKillAll={killAllFx} onHardSync={hardSync} onJog={handleJog} onJogRelease={releaseJog} onJoystick={joystickHandler} onPresetRecall={recallPreset} onPresetSave={savePreset} onBlackout={() => handleBlackoutOn()} keyJoyRef={keyJoyRef} />}
          {tab === 'FOLLOWSPOT' && <HorizonFollowspotTab accent={accent} joystickSize={195} state={state} setState={setState} onJoystick={joystickHandler} onMapTap={handleMapTap} keyJoyRef={keyJoyRef} />}
          {tab === 'PROGRAMMER' && <HorizonProgrammerTab accent={accent} joystickSize={195} state={state} setState={setState} bpm={bpm} tap={tapWithFirmware} onJoystick={joystickHandler} onPresetRecall={recallPreset} onPresetSave={savePreset} keyJoyRef={keyJoyRef} />}
          {tab === 'PATCH' && <HorizonPatchTab accent={accent} />}
        </div>
        <MutedWarning show={muted} onUnmute={handleMute} />
        <div className="hz-landscape-prompt"><div style={{ fontSize: 48 }}>⟳</div><div style={{ fontSize: 16, fontWeight: 700, color: '#fff', letterSpacing: 1 }}>ROTATE DEVICE</div><div style={{ fontSize: 12, color: 'rgba(255,255,255,0.45)', textAlign: 'center', maxWidth: 220 }}>Horizon is designed for landscape orientation</div></div>
        {state.blackout && <div onClick={handleBlackoutOff} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.96)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 500, cursor: 'pointer' }}><div style={{ fontSize: 13, fontWeight: 900, letterSpacing: 6, color: '#7f1d1d', textTransform: 'uppercase', marginBottom: 12 }}>BLACKOUT</div><div style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)', letterSpacing: 0.5 }}>Tap anywhere to release</div></div>}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>
</body>
</html>
