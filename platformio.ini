; PlatformIO project config — lets Claude Code (and anyone else) compile-check
; this sketch on the command line without the Arduino IDE. Does not replace
; or interfere with opening/flashing this folder as a normal Arduino sketch.
; See doc/content/handover.md -> "Setup & Flashen" for Arduino IDE settings,
; and doc/content/history.md (2026-08-15) for how this was set up.

[platformio]
src_dir = .

[env:supermini]
platform = espressif32
board = nologo_esp32c3_super_mini
framework = arduino
lib_deps =
    rstephan/ArtnetWifi
; Custom partition table -- see partitions_horizon.csv for the reasoning and for the parts of
; it that must not be touched (nvs holds the entire saved configuration). Switching to it
; requires ONE USB flash: the table lives at 0x8000 and OTA only ever writes an app slot.
; The filesystem must be re-uploaded afterwards, its offset moves.
board_build.partitions = partitions_horizon.csv
; src_dir = . means PlatformIO sweeps up everything in the project root, which would pull the
; host simulator into the firmware build (it defines main() and includes fake Arduino headers).
; Keep the sketch and its headers, exclude the simulator and the build cache.
build_src_filter =
    +<*>
    -<sim/>
    -<.pio/>
    -<.claude/>
